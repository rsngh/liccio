name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Sync (all extras)
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src
      - name: Unit + integration
        run: uv run pytest tests/unit tests/integration -q
      - name: E2E
        run: uv run pytest tests/e2e -q --timeout=600
      - name: Coverage
        run: uv run pytest tests/unit tests/integration --cov=acp --cov-report=term-missing
