[project]
name = "agent-control-plane"
version = "0.1.0"
description = "Agentic software-engineering control plane: route, run, verify, evaluate, and learn from coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "agent-control-plane" }]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "gitpython>=3.1",
    "networkx>=3.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.scripts]
acp = "acp.cli.main:app"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
data = ["pandas>=2.2", "scikit-learn>=1.4"]
context = [
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tiktoken>=0.6",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.18.0",
]
agents = ["openai>=1.30", "anthropic>=0.40"]
verification = ["coverage>=7.4"]
learning = ["scikit-learn>=1.4", "joblib>=1.3"]
observability = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "respx>=0.21",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["src/acp/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
ignore = ["B008", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
packages = ["acp"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/fixtures", "tests/live", "evals", ".git", ".venv"]
addopts = "-ra --ignore=tests/fixtures --ignore=tests/live"
markers = [
    "slow: long-running tests",
    "live: tests requiring real API keys (skipped by default)",
    "live_openai: live tests against the OpenAI API",
    "live_second_harness: live tests against the second harness (Anthropic)",
    "live_docker: live tests requiring a working Docker daemon",
    "live_pgvector: tests requiring a live pgvector Postgres",
    "live_qdrant: tests requiring qdrant-client (real local engine)",
    "e2e: end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/acp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
